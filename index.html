<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Senga kichkina tilak 🌷</title>
<style>
  /* ============ Umumiy sozlamalar ============ */
  :root {
    --pink: #fde8ee;
    --cream: #fff7ea;
    --mint: #e4f3e6;
    --ink: #5a4a52;
    --soft-ink: #8a7780;
    --green: #8fc9a0;
    --green-dark: #6fb384;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: Georgia, "Palatino Linotype", "Times New Roman", serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--pink) 0%, var(--cream) 50%, var(--mint) 100%);
    overflow-x: hidden;
  }

  /* ============ Tabrik kartasi ============ */
  .card {
    position: relative;
    z-index: 1;                       /* yaproqlardan oldinda turadi */
    width: 100%;
    max-width: 440px;
    padding: clamp(24px, 6vw, 40px) clamp(18px, 5vw, 32px);
    background: rgba(255, 252, 248, 0.88);
    border-radius: 30px;
    box-shadow: 0 20px 50px rgba(200, 150, 165, 0.22);
    text-align: center;
    animation: cardIn 1.2s ease-out both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(18px) scale(0.98); }
    to   { opacity: 1; transform: none; }
  }

  /* ============ Boshlang'ich ko'rinish ============ */
  .intro { transition: opacity 0.6s ease; }
  .intro.hide { opacity: 0; }
  .intro p {
    font-size: clamp(1.3rem, 5vw, 1.6rem);
    margin-bottom: 26px;
    font-style: italic;
  }
  .btn {
    font: inherit;
    font-size: 1.05rem;
    padding: 12px 34px;
    border: none;
    border-radius: 999px;
    color: #fff;
    background: linear-gradient(135deg, #f4a8bf, #f2b9a0);
    box-shadow: 0 8px 20px rgba(240, 160, 180, 0.4);
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(240, 160, 180, 0.45); }
  .btn:focus-visible { outline: 3px solid #bfe3c9; outline-offset: 3px; }
  .btn:disabled { opacity: 0.6; cursor: default; transform: none; }

  /* ============ Gullar bog'i ============ */
  .garden { display: none; opacity: 0; transition: opacity 0.8s ease; }
  .garden.show { opacity: 1; }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .row:nth-child(even) { flex-direction: row-reverse; }

  .wish {
    flex: 1;
    font-size: clamp(1.05rem, 4.2vw, 1.25rem);
    line-height: 1.45;
    text-align: left;
    opacity: 0;
    transform: translateX(12px);
    transition: opacity 1.2s ease, transform 1.2s ease;
  }
  .row:nth-child(even) .wish { text-align: right; transform: translateX(-12px); }
  .wish.show { opacity: 1; transform: none; }

  /* ============ Gul (faqat CSS) ============ */
  .flower {
    position: relative;
    flex: none;
    width: 96px;
    height: 150px;
    transform-origin: 50% 100%;
  }
  .flower.f1 { --p1: #f6a6bd; --p2: #f9cad7; --core: #f7c948; }
  .flower.f2 { --p1: #f8b595; --p2: #fbd5bd; --core: #f2a65a; }
  .flower.f3 { --p1: #c3b0ec; --p2: #e1d6f8; --core: #fbe28c; }

  /* Poya */
  .stem {
    position: absolute;
    left: calc(50% - 2.5px);
    top: 40px;
    width: 5px;
    height: 110px;
    border-radius: 3px;
    background: linear-gradient(var(--green), var(--green-dark));
    transform: scaleY(0);
    transform-origin: top;
    transition: transform 1.1s ease-out;
  }
  .grow .stem { transform: scaleY(1); }

  /* Barglar */
  .leaf {
    position: absolute;
    top: 96px;
    width: 34px;
    height: 18px;
    background: var(--green);
    opacity: 0;
    transition: transform 1s ease 0.7s, opacity 1s ease 0.7s;
  }
  .leaf.l {
    left: calc(50% - 34px);
    border-radius: 0 100% 0 100%;
    transform-origin: 100% 100%;
    transform: rotate(-10deg) scale(0);
  }
  .leaf.r {
    left: 50%;
    border-radius: 100% 0 100% 0;
    transform-origin: 0 100%;
    transform: rotate(10deg) scale(0);
  }
  .grow .leaf { opacity: 1; }
  .grow .leaf.l { transform: rotate(-22deg) scale(1); }
  .grow .leaf.r { transform: rotate(22deg) scale(1); }

  /* Gul boshi */
  .bloom {
    position: absolute;
    left: calc(50% - 40px);
    top: 0;
    width: 80px;
    height: 80px;
  }
  .petal {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 24px;
    height: 33px;
    margin-left: -12px;
    margin-top: -33px;                 /* yaproq asosi gul markazida */
    border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
    background: var(--p1);
    transform-origin: 50% 100%;
    transform: rotate(calc(var(--i) * 45deg)) scale(0);
    transition: transform 1.3s cubic-bezier(.2,.8,.3,1);
    transition-delay: calc(var(--i) * 90ms);
  }
  .petal:nth-child(even) { background: var(--p2); }
  .open .petal { transform: rotate(calc(var(--i) * 45deg)) scale(1); }

  .core {
    position: absolute;
    left: calc(50% - 10px);
    top: calc(50% - 10px);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff4c4, var(--core));
    transform: scale(0);
    transition: transform 0.9s ease 0.3s;
  }
  .open .core { transform: scale(1); }

  /* Ochilgandan so'ng muloyim chayqalish */
  .open { animation: sway 6s ease-in-out infinite; }
  @keyframes sway {
    0%, 100% { transform: rotate(-1.8deg); }
    50%      { transform: rotate(1.8deg); }
  }

  /* ============ Yakuniy yozuv ============ */
  .final {
    margin-top: 16px;
    font-style: italic;
    font-size: clamp(1.05rem, 4.2vw, 1.2rem);
    color: var(--soft-ink);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 1.4s ease, transform 1.4s ease;
  }
  .final.show { opacity: 1; transform: none; }

  /* ============ Suzib yuruvchi yaproqlar ============ */
  .petals {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .drift {
    position: absolute;
    top: -30px;
    border-radius: 60% 0 60% 0;
    opacity: 0;
    animation: drift linear infinite;
  }
  @keyframes drift {
    0%   { transform: translate(0, -5vh) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.55; }
    50%  { transform: translate(40px, 55vh) rotate(160deg); }
    90%  { opacity: 0.5; }
    100% { transform: translate(-20px, 110vh) rotate(320deg); opacity: 0; }
  }

  /* ============ Harakatni kamaytirish sozlamasi ============ */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition-duration: 0.01ms !important;
      transition-delay: 0s !important;
    }
    .petals { display: none; }
  }
</style>
</head>
<body>

  <!-- Orqa fondagi yaproqlar (JS to'ldiradi) -->
  <div class="petals" id="petals" aria-hidden="true"></div>

  <main class="card">

    <!-- Boshlang'ich qism -->
    <section class="intro" id="intro">
      <p>Senga kichkina bir tilagim bor…</p>
      <button class="btn" id="openBtn" type="button">Ochish</button>
    </section>

    <!-- Gullar va tilaklar -->
    <section class="garden" id="garden" aria-live="polite">
      <div class="row">
        <div class="flower f1">
          <span class="stem"></span><span class="leaf l"></span><span class="leaf r"></span>
          <div class="bloom">
            <span class="petal" style="--i:0"></span><span class="petal" style="--i:1"></span>
            <span class="petal" style="--i:2"></span><span class="petal" style="--i:3"></span>
            <span class="petal" style="--i:4"></span><span class="petal" style="--i:5"></span>
            <span class="petal" style="--i:6"></span><span class="petal" style="--i:7"></span>
            <span class="core"></span>
          </div>
        </div>
        <p class="wish">Kayfiyating doim chiroyli bo‘lsin.</p>
      </div>

      <div class="row">
        <div class="flower f2">
          <span class="stem"></span><span class="leaf l"></span><span class="leaf r"></span>
          <div class="bloom">
            <span class="petal" style="--i:0"></span><span class="petal" style="--i:1"></span>
            <span class="petal" style="--i:2"></span><span class="petal" style="--i:3"></span>
            <span class="petal" style="--i:4"></span><span class="petal" style="--i:5"></span>
            <span class="petal" style="--i:6"></span><span class="petal" style="--i:7"></span>
            <span class="core"></span>
          </div>
        </div>
        <p class="wish">Har kuningda quvonch topilsin.</p>
      </div>

      <div class="row">
        <div class="flower f3">
          <span class="stem"></span><span class="leaf l"></span><span class="leaf r"></span>
          <div class="bloom">
            <span class="petal" style="--i:0"></span><span class="petal" style="--i:1"></span>
            <span class="petal" style="--i:2"></span><span class="petal" style="--i:3"></span>
            <span class="petal" style="--i:4"></span><span class="petal" style="--i:5"></span>
            <span class="petal" style="--i:6"></span><span class="petal" style="--i:7"></span>
            <span class="core"></span>
          </div>
        </div>
        <p class="wish">Orzularingga yaqinlashib yur.</p>
      </div>

      <p class="final" id="final">Shunchaki kuningga ozgina tabassum qo‘shgim keldi 🌷</p>
    </section>

  </main>

<script>
  (function () {
    var btn = document.getElementById('openBtn');
    var intro = document.getElementById('intro');
    var garden = document.getElementById('garden');
    var finalText = document.getElementById('final');
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var started = false; // takroriy bosishdan himoya

    // Kutish yordamchisi (harakat kamaytirilsa deyarli kutmaydi)
    function wait(ms) {
      return new Promise(function (r) { setTimeout(r, reduceMotion ? 50 : ms); });
    }

    // ---- Suzib yuruvchi mayda yaproqlar ----
    function makePetals() {
      if (reduceMotion) return;
      var box = document.getElementById('petals');
      var colors = ['#f9c9d6', '#fbd5bd', '#d9ecd9', '#e1d6f8', '#fde1e8'];
      for (var i = 0; i < 14; i++) {
        var p = document.createElement('span');
        var size = 9 + Math.random() * 9;
        p.className = 'drift';
        p.style.left = (Math.random() * 100) + '%';
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.background = colors[i % colors.length];
        p.style.animationDuration = (16 + Math.random() * 12) + 's';
        p.style.animationDelay = (-Math.random() * 20) + 's';
        box.appendChild(p);
      }
    }

    // ---- Bitta gulni ochish ----
    async function bloom(row) {
      var flower = row.querySelector('.flower');
      var wish = row.querySelector('.wish');
      flower.classList.add('grow');   // poya va barglar o'sadi
      await wait(900);
      flower.classList.add('open');   // yaproqlar ochiladi
      await wait(1400);
      wish.classList.add('show');     // tilak paydo bo'ladi
      await wait(1500);
    }

    // ---- Asosiy ketma-ketlik ----
    async function run() {
      if (started) return;            // ikkinchi bosish hech narsa buzmaydi
      started = true;
      btn.disabled = true;

      intro.classList.add('hide');
      await wait(650);
      intro.style.display = 'none';

      garden.style.display = 'block';
      void garden.offsetWidth;        // brauzerga yangilanishni majburlash
      garden.classList.add('show');
      await wait(700);

      var rows = garden.querySelectorAll('.row');
      for (var i = 0; i < rows.length; i++) {
        await bloom(rows[i]);
      }
      finalText.classList.add('show');
    }

    btn.addEventListener('click', run);
    makePetals();
  })();
</script>
</body>
</html>
